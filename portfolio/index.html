<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Պորտֆոլիո · ISD</title>
<meta name="theme-color" content="#f5f5f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ISD Պորտֆոլիո">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../assets/icons/portfolio-192.png">
<link rel="apple-touch-icon" href="../assets/icons/portfolio-180.png">
<link rel="preload" href="../assets/fonts/nsa-hy-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
/* Portfolio: a clinical record book — porcelain paper, ink, one coral mark for what is missing. */
.lead{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:end;margin:6px 0 22px}
.lead p{color:var(--ink-2);margin-top:10px;max-width:52ch}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font:700 clamp(26px,5vw,34px)/1 var(--serif)}
.kpi span{font-size:13px;color:var(--ink-3)}
@media(max-width:720px){.lead{grid-template-columns:1fr}}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input{flex:1;min-width:180px}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.case{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;width:100%}
.case b{display:block;font-size:16px;line-height:1.3}
.case .muted{font-size:13px}
.ring{width:56px;height:56px}
.ring text{font:700 15px var(--font);fill:var(--ink)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.filters .chip{flex:none}
.filters .chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* case editor */
.ce-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.ce-head .t{flex:1;min-width:200px}
.ce-head .t b{font:700 24px/1.15 var(--serif);display:block}
.care{display:flex;gap:4px;margin:8px 0 0}
.care i{flex:1;height:5px;border-radius:4px;background:var(--line)}
.care i.on{background:var(--ink)}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;min-height:56px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h3{flex:1}
details.sec>summary .dot{width:10px;height:10px;border-radius:50%;background:var(--line-2);flex:none}
details.sec>summary .dot.on{background:var(--ok)}
details.sec>summary .chev{transition:transform .15s;color:var(--ink-3)}
details.sec[open]>summary .chev{transform:rotate(90deg)}
details.sec .body{padding:0 16px 16px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--paper)}
.item .row.top{justify-content:space-between;margin-bottom:8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs .th{position:relative;width:108px}
.thumbs canvas{width:108px;height:72px;border-radius:8px;display:block;background:var(--field)}
.thumbs input{min-height:34px;padding:4px 8px;font-size:13px;margin-top:4px}
.thumbs .rm{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(16,21,23,.7);color:#fff;display:grid;place-items:center;padding:0}
.thumbs .rm svg{width:14px;height:14px}
.series{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:12px}
.series .s{background:#0b0e0f;border-radius:12px;overflow:hidden;color:#eef1ef}
.series img{width:100%;aspect-ratio:16/10;object-fit:contain;display:block;background:#0b0e0f}
.series .s div{padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.series .s a{color:#ff5c47}
.sticky-act{position:sticky;bottom:calc(84px + var(--safe-b));z-index:10;display:flex;justify-content:flex-end;pointer-events:none;margin-top:16px}
.sticky-act .btn{pointer-events:auto;box-shadow:var(--shadow)}
@media(min-width:900px){.sticky-act{bottom:96px}}

/* logbook */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:12px;border-radius:6px;background:var(--field);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--ink);border-radius:6px}
.bar b{text-align:right}
table.log{width:100%;border-collapse:collapse;font-size:14px}
table.log th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line)}
table.log td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.log td.num{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}

/* CV */
.cvsec{margin-bottom:12px}
.cvitem{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,.8fr) 44px;gap:8px;margin-bottom:8px;align-items:start}
@media(max-width:640px){.cvitem{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px}.cvitem .wide{grid-column:1/-1}}
.cvitem input{min-height:42px}

/* print: CV and logbook */
#print{font-family:var(--font);color:#111}
#print h1{font:700 26pt/1.1 var(--serif);margin:0}
#print .cvph{float:right;width:32mm;height:40mm;object-fit:cover;border-radius:3mm;margin:0 0 4mm 8mm}
.cvphoto{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.cvphoto .ava{width:84px;height:105px;border-radius:12px;background:#eceeea;display:grid;place-items:center;overflow:hidden;flex:none;color:#9aa19e}
.cvphoto .ava img{width:100%;height:100%;object-fit:cover}
.cvphoto .ava svg{width:36px;height:36px}
label.btn{cursor:pointer}
#print .sub{font-size:12pt;color:#444;margin:6px 0 14px}
#print h2{font:700 13pt var(--font);color:#b8321f;margin:16px 0 6px;border-bottom:1px solid #ddd;padding-bottom:3px}
#print .it{display:grid;grid-template-columns:28mm 1fr;gap:4mm;font-size:10.5pt;margin-bottom:5px;break-inside:avoid}
#print .it .w{color:#555}
#print table{width:100%;border-collapse:collapse;font-size:9.5pt}
#print th,#print td{border-bottom:1px solid #ddd;padding:4px;text-align:left}
@page{size:A4;margin:16mm}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#cases"><span id="mark"></span><span><b>Պորտֆոլիո</b><small>ISD Dental School</small></span></a>
  <span class="grow"></span>
  <a class="btn small ghost" href="../photo/">Ֆոտո</a>
</header>
<main id="app"><p class="muted">Բեռնվում է…</p></main>
<div id="print" class="print-only"></div>
<nav class="nav" style="--n:4" aria-label="Բաժիններ">
  <button data-tab="cases"><span class="ic" data-i="cases"></span>Դեպքեր</button>
  <button data-tab="log"><span class="ic" data-i="log"></span>Գրանցամատյան</button>
  <button data-tab="cv"><span class="ic" data-i="cv"></span>CV</button>
  <button data-tab="more"><span class="ic" data-i="more"></span>Ավելին</button>
</nav>
<input type="file" id="pick" accept="image/*" multiple hidden>
<input type="file" id="restore" accept="application/json,.json" hidden>
<script src="../assets/js/config.js"></script>
<script src="../assets/vendor/exifr.lite.umd.js"></script>
<script src="../assets/js/core.js"></script>
<script src="../assets/js/protocols.js"></script>
<script src="../assets/js/survey.js"></script>
<script src="../assets/js/casedeck.js"></script>
<script src="app.js"></script>
</body>
</html>
